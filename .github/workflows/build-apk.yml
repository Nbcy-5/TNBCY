name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install Android SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.1" \
            "ndk;28.1.13356709" "cmake;3.10.2.4988404"

      - name: Install Godot and export templates
        run: |
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q "Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"

      - name: Restore signing key and Godot settings
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "Missing secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/tnbcy.keystore"
          echo "KS_PATH=$RUNNER_TEMP/tnbcy.keystore" >> "$GITHUB_ENV"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/tnbcy.keystore"
          export/android/debug_keystore_user = "tnbcy"
          export/android/debug_keystore_pass = "$KS_PASS"
          EOF
          cp ~/.config/godot/editor_settings-4.7.tres ~/.config/godot/editor_settings-4.tres

      - name: Import project and build C#
        run: |
          export GODOT_SILENCE_ROOT_WARNING=1
          "$GODOT" --headless --path . --import || true
          dotnet build TNBCY.csproj

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ env.KS_PATH }}
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: tnbcy
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ env.KS_PATH }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: tnbcy
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p Builds
          "$GODOT" --headless --path . --export-debug "Android" Builds/TNBCY.apk
          ls -lh Builds/TNBCY.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TNBCY-apk
          path: Builds/TNBCY.apk
