name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Install Android SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.1" \
            "ndk;28.1.13356709" "cmake;3.10.2.4988404"

      - name: Install Godot and export templates
        run: |
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q "Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"

      - name: Restore signing key and Godot settings
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "Missing secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/tnbcy.keystore"
          echo "KS_PATH=$RUNNER_TEMP/tnbcy.keystore" >> "$GITHUB_ENV"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/tnbcy.keystore"
          export/android/debug_keystore_user = "tnbcy"
          export/android/debug_keystore_pass = "$KS_PASS"
          EOF
          cp ~/.config/godot/editor_settings-4.7.tres ~/.config/godot/editor_settings-4.tres

      - name: Import project and build C#
        run: |
          export GODOT_SILENCE_ROOT_WARNING=1
          "$GODOT" --headless --path . --import || true
          dotnet build TNBCY.csproj

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ env.KS_PATH }}
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: tnbcy
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ env.KS_PATH }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: tnbcy
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p Builds
          "$GODOT" --headless --path . --export-debug "Android" Builds/TNBCY.apk
          ls -lh Builds/TNBCY.apk

      - name: Build content pack (optional)
        continue-on-error: true
        run: |
          export GODOT_SILENCE_ROOT_WARNING=1
          "$GODOT" --headless --path . --export-pack "Content" Builds/content.pck
          ls -lh Builds/content.pck

      - name: Save APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: TNBCY-apk
          path: Builds/TNBCY.apk

      - name: Publish update for the in-game updater
        env:
          GH_TOKEN: ${{ secrets.UPDATES_TOKEN }}
          UPD_REPO: Nbcy-5/tnbcy-updates
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "UPDATES_TOKEN not set - skipping the in-game update release"; exit 0; fi
          CODE=$(grep -oP '^version/code=\K[0-9]+' export_presets.cfg | head -1)
          NAME=$(grep -oP '^version/name="\K[^"]+' export_presets.cfg | head -1)
          APKV=$(grep -oP 'ApkVersion = \K[0-9]+' Scripts/Updater.cs | head -1)
          if [ "$CODE" != "$APKV" ]; then echo "Version mismatch: export preset code $CODE but Updater.cs ApkVersion $APKV - not publishing"; exit 1; fi
          mkdir -p rel
          cp Builds/TNBCY.apk rel/TNBCY.apk
          [ -f Builds/content.pck ] && cp Builds/content.pck rel/content.pck || true
          if [ ! -f Builds/content.pck ]; then echo "WARNING: content.pck was not built - silent content updates will not reach the game this time"; fi
          export CODE NAME
          python3 - <<'PY'
          import json, os
          code, name = int(os.environ["CODE"]), os.environ["NAME"]
          tag = "v" + str(code) + "-build-" + os.environ["GITHUB_RUN_ID"]
          base = "https://github.com/" + os.environ["UPD_REPO"] + "/releases/download/" + tag + "/"
          lines = open("CHANGES.txt", encoding="utf-8").read().split("\n\n")[0].split("\n")
          short = [l.strip()[:90] for l in lines[:4]]
          notes = ("Version " + name + "\n" + "\n".join(short)).strip()
          patch = int(open("content_patch.txt").read().strip() or 0) if os.path.exists("content_patch.txt") else 0
          v = {"apkVersion": code, "contentVersion": code * 100 + patch, "apkUrl": base + "TNBCY.apk", "notes": notes}
          if os.path.exists("rel/content.pck"): v["pckUrl"] = base + "content.pck"
          json.dump(v, open("rel/version.json", "w"), indent=2)
          PY
          TAG="v${CODE}-build-${GITHUB_RUN_ID}"
          PUBLISHED=0
          for ATTEMPT in 1 2 3 4 5; do
            if gh release view "$TAG" -R "$UPD_REPO" >/dev/null 2>&1; then
              echo "Release $TAG already exists; not creating a duplicate."
              PUBLISHED=1
              break
            fi
            if gh release create "$TAG" rel/TNBCY.apk $( [ -f rel/content.pck ] && echo rel/content.pck ) rel/version.json -R "$UPD_REPO" --title "TNBCY $NAME (Build $CODE)" --notes "Build $CODE; workflow run $GITHUB_RUN_ID" --latest; then
              PUBLISHED=1
              break
            fi
            echo "Release publishing attempt $ATTEMPT failed; retrying after a short delay."
            sleep $((ATTEMPT * 10))
          done
          if [ "$PUBLISHED" -ne 1 ]; then
            echo "Could not publish release after 5 attempts."
            exit 1
          fi
          cat rel/version.json
